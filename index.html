<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Dice Party</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>🎲 QR Dice Party</h1><p>Scan • Join • Roll • Pass</p></header><section id="setup" class="card"><h2>Game Setup</h2><p>पहले Firebase config को <code>config.js</code> में भरें।</p><button id="create">Create New Game</button><p id="setupError" class="error"></p></section><section id="lobby" class="card hidden"><h2>Scan to Join</h2><div id="qr"></div><p><a id="joinLink" target="_blank" rel="noopener"></a></p><button id="copy">Copy Join Link</button><p id="lobbyInfo"></p><div id="players"></div><button id="start">Start Game</button></section><section id="join" class="card hidden"><h2>Join Game</h2><input id="name" maxlength="24" placeholder="Your name" autocomplete="nickname"><button id="joinBtn">Join</button><p id="joinError" class="error"></p></section><section id="game" class="card hidden"><h2 id="status">Waiting...</h2><div id="die">⚀</div><p id="result"></p><button id="roll">Roll Dice</button><p id="turnHelp"></p><h3>Players</h3><div id="gamePlayers"></div><button id="reset" class="secondary hidden">New Round</button></section><footer>Every player needs their own phone. One turn per player; rolling 6 grants an extra turn.</footer></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script type="module" src="app.js"></script></body></html>
